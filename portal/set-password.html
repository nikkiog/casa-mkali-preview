<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>cm portal · set your password</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="portal.css" />
</head>
<body>

<header class="tb"><div class="tb__in">
  <div><span class="wm tb__wm">casa<b>mkali</b><span class="dot">.</span></span><span class="tb__tag">portal</span></div>
  <div class="tb__user"><span class="hide-m mono">first sign-in</span></div>
</div></header>

<div class="wrap">
  <div class="login">
    <div class="kick"><span class="dot"></span><span>one step before you're in</span></div>
    <h1 class="big">set your password<span class="flame">.</span></h1>
    <p class="lede">Your temporary password worked. Choose your own now, it's the only one you'll use from here.</p>

    <form class="sec" onsubmit="return setpw(event)">
      <div class="fld"><label>your login email</label><input id="em" type="email" value="" disabled /></div>
      <div class="fld"><label>new password</label><input id="p1" type="password" placeholder="at least 8 characters" /></div>
      <div class="fld"><label>confirm password</label><input id="p2" type="password" placeholder="type it again" /></div>
      <button class="btn" type="submit">save and continue →</button>
      <p class="err" id="err" style="margin-top:16px"></p>
    </form>
  </div>
  <div class="mocknote">mockup · in the real build this is enforced server-side, the temporary password stops working the moment this is saved</div>
</div>

<script>
var q=new URLSearchParams(location.search);
var role=(q.get('role')||'creator').toLowerCase();
var email=q.get('email')||(role==='team'?'teammate@casamkali.com':'carlos@example.com');
document.getElementById('em').value=email;
function setpw(e){
  e.preventDefault();
  var a=document.getElementById('p1').value,b=document.getElementById('p2').value,err=document.getElementById('err');
  if(a.length<8){err.textContent='use at least 8 characters';err.style.display='block';return false;}
  if(a!==b){err.textContent='those two do not match';err.style.display='block';return false;}
  location.href = role==='team' ? 'admin.html' : 'welcome.html';
  return false;
}
</script>
</body>
</html>
